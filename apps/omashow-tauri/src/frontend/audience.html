<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>OmaDeck — Audience</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      cursor: none;
    }
    body.show-cursor {
      cursor: default;
    }
    #slide-canvas {
      position: relative;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 0 32px rgba(0, 0, 0, 0.9);
      transition: background 0.15s ease;
    }
    #slide-canvas.blackout { background: #000 !important; }
    #slide-canvas.whiteout { background: #fff !important; }
    #slide-canvas.blackout .slide-shape,
    #slide-canvas.blackout .slide-pic,
    #slide-canvas.blackout .slide-media,
    #slide-canvas.whiteout .slide-shape,
    #slide-canvas.whiteout .slide-pic,
    #slide-canvas.whiteout .slide-media { visibility: hidden !important; }
    #slide-canvas.blackout #ink-overlay,
    #slide-canvas.blackout #laser,
    #slide-canvas.whiteout #ink-overlay,
    #slide-canvas.whiteout #laser { display: none; }
    #ink-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    #laser {
      position: absolute;
      width: 14px;
      height: 14px;
      margin: -7px 0 0 -7px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, #ff453a 45%, rgba(255,69,58,0) 72%);
      box-shadow: 0 0 10px 3px rgba(255,69,58,0.8), 0 0 26px 9px rgba(255,69,58,0.35);
      pointer-events: none;
      display: none;
      z-index: 10;
    }
    .slide-shape {
      position: absolute;
      overflow: hidden;
      padding: 2px 4px;
      line-height: 1.2;
      white-space: pre-wrap;
      word-break: break-word;
      color: #1f2430;
      font-family: system-ui, sans-serif;
      box-sizing: border-box;
    }
    .slide-pic {
      position: absolute;
      overflow: hidden;
    }
    .slide-pic img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }
    .slide-media {
      position: absolute;
      overflow: hidden;
      background: #0a0d14;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slide-media video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .slide-media audio {
      width: 100%;
      height: 40px;
    }
    .slide-media .media-glyph {
      font-size: 28px;
      color: rgba(226,232,240,0.75);
      user-select: none;
      pointer-events: none;
    }
    .slide-media .media-ctl {
      position: absolute;
      left: 4px;
      bottom: 4px;
      display: flex;
      gap: 4px;
      z-index: 3;
    }
    .slide-media .media-ctl button {
      min-width: 24px;
      height: 24px;
      padding: 0 6px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 5px;
      background: rgba(15,19,30,0.82);
      color: #f8fafc;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
    }
    .slide-media .media-ctl button:hover {
      background: rgba(30,41,59,0.95);
    }
  </style>
</head>
<body>
  <div id="slide-canvas"></div>
  <svg id="ink-overlay" viewBox="0 0 12192000 6858000" preserveAspectRatio="none" aria-hidden="true"><g id="ink-strokes"></g></svg>
  <div id="laser"></div>
  <script src="slide_render.js"></script>
  <script src="audience.js"></script>
</body>
</html>
