name: Build & Release App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: macOS (.dmg & .app)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry & build targets
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/omashow-core
            crates/omashow-cli
            apps/omashow-tauri/src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0"

      - name: Build macOS App & DMG
        working-directory: apps/omashow-tauri
        run: |
          cargo tauri build

      - name: Prepare build artifacts
        run: |
          mkdir -p artifacts
          BUNDLE_DIR="target/release/bundle"
          if [ -d "$BUNDLE_DIR/dmg" ]; then
            cp $BUNDLE_DIR/dmg/*.dmg artifacts/ || true
          fi
          if [ -d "$BUNDLE_DIR/macos" ]; then
            cd "$BUNDLE_DIR/macos"
            tar -czf "$GITHUB_WORKSPACE/artifacts/OmaDeck-macos-app.tar.gz" OmaDeck*.app
            cd "$GITHUB_WORKSPACE"
          fi

      - name: Upload macOS Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Omashow Latest Build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: artifacts/*
          generate_release_notes: true

  build-linux:
    name: Linux (.AppImage & .deb)
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build targets
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/omashow-core
            crates/omashow-cli
            apps/omashow-tauri/src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0"

      - name: Build Linux AppImage & DEB
        working-directory: apps/omashow-tauri
        run: |
          cargo tauri build --bundles appimage,deb

      - name: Patch AppImage to remove conflicting Wayland client libraries
        run: |
          curl -L -s https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage
          mkdir -p /tmp/ait && cd /tmp/ait && /tmp/appimagetool.AppImage --appimage-extract > /dev/null && cd "$GITHUB_WORKSPACE"
          for appimage in target/release/bundle/appimage/*.AppImage; do
            [ -f "$appimage" ] || continue
            echo "Patching $appimage..."
            rm -rf /tmp/app-root
            mkdir -p /tmp/app-root && cd /tmp/app-root && "$GITHUB_WORKSPACE/$appimage" --appimage-extract > /dev/null && cd "$GITHUB_WORKSPACE"
            rm -f /tmp/app-root/squashfs-root/usr/lib/libwayland-*.so*
            ARCH=x86_64 /tmp/ait/squashfs-root/AppRun /tmp/app-root/squashfs-root "$appimage"
            rm -rf /tmp/app-root
          done
          rm -rf /tmp/ait /tmp/appimagetool.AppImage

      - name: Prepare build artifacts
        run: |
          mkdir -p artifacts
          BUNDLE_DIR="target/release/bundle"
          if [ -d "$BUNDLE_DIR/appimage" ]; then
            cp $BUNDLE_DIR/appimage/*.AppImage artifacts/ || true
          fi
          if [ -d "$BUNDLE_DIR/deb" ]; then
            cp $BUNDLE_DIR/deb/*.deb artifacts/ || true
          fi

      - name: Upload Linux Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Omashow Latest Build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: artifacts/*
          generate_release_notes: true
