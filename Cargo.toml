[workspace]
members = [
    "crates/omashow-core",
    "crates/omashow-cli",
    "apps/omashow-tauri/src-tauri",
    "vendor/powerpoint-ooxml",
]
resolver = "2"

[workspace.dependencies]
office-toolkit = "1.0"
opc-ooxml = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

# Local fork of the registry `powerpoint-ooxml` 1.0.0 with SmartArt
# (`<a:graphicData uri=".../diagram">`) graphic frames modelled as `Shape::SmartArt`
# instead of erroring out on them. Patches the registry version for every crate in the
# workspace so the vendored source is the single source of truth.
[patch.crates-io]
powerpoint-ooxml = { path = "vendor/powerpoint-ooxml" }
